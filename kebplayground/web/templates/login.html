{% extends "base.html" %}
{% block title %}sign in · kiWe{% endblock %}
{% block content %}
<div class="card centre">
  <h1>Find your match</h1>
  <p>Sign in with your <strong>@{{ domain }}</strong> account to take part.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <p class="actions centre">
    <a class="button" href="/login">Sign in with Google</a>
  </p>
</div>
{% endblock %}
