{% extends "base.html" %}
{% block title %}your match · keb playground{% endblock %}
{% block content %}
<div class="card centre match-card">
  <p class="eyebrow">{{ mode }}</p>
  <h1>{{ name }}, meet {{ partner_name }}</h1>
  {% if message %}<p class="match-message">{{ message }}</p>{% endif %}
  <p class="match-contact">Reach them at <strong>{{ partner_contact }}</strong></p>
  <p class="match-score">match score {{ '%.0f' % (score * 100) }}%</p>
</div>
{% endblock %}
